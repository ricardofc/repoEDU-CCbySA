<svg aria-roledescription="sequence" role="graphics-document document" viewBox="-50 -10 600 500" height="500" xmlns="http://www.w3.org/2000/svg" width="600" id="container_capture">
<style>
    /* Estilos básicos herdados para manter coherencia */
    .actor { stroke: #666; fill: #eaeaea; }
    .text { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 16px; fill: #333; }
    .line { stroke: #333; stroke-width: 2; fill: none; }
    .dash { stroke-dasharray: 5,5; }
    .note { stroke: #aaaa33; fill: #fff5ad; }
    .arrow { fill: #333; }
</style>
<defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
</defs>

<!-- Actor: Cliente -->
<g><rect class="actor" x="50" y="0" width="150" height="50" rx="3" ry="3"/>
<text x="125" y="30" text-anchor="middle" class="text">Cliente (Vítima)</text>
<line x1="125" y1="50" x2="125" y2="450" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/></g>

<!-- Actor: Atacante -->
<g><rect class="actor" x="350" y="0" width="200" height="50" rx="3" ry="3"/>
<text x="450" y="30" text-anchor="middle" class="text">Responder (Atacante)</text>
<line x1="450" y1="50" x2="450" y2="450" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/></g>

<!-- Interaccións -->
<!-- 1 -->
<text x="287" y="90" text-anchor="middle" class="text" font-size="14">1. Broadcast: "Quen é \\SVR-ARQUIVOS?"</text>
<line x1="125" y1="100" x2="440" y2="100" class="line" marker-end="url(#arrowhead)"/>

<!-- 2 -->
<text x="287" y="140" text-anchor="middle" class="text" font-size="14">2. Poisoning: "Son eu! (IP Atacante)"</text>
<line x1="450" y1="150" x2="135" y2="150" class="line" marker-end="url(#arrowhead)"/>

<!-- 3 -->
<text x="287" y="200" text-anchor="middle" class="text">3. NTLM Negotiate</text>
<line x1="125" y1="210" x2="440" y2="210" class="line" marker-end="url(#arrowhead)"/>

<!-- 4 -->
<text x="287" y="250" text-anchor="middle" class="text">4. NTLM Challenge</text>
<line x1="450" y1="260" x2="135" y2="260" class="line" marker-end="url(#arrowhead)"/>

<!-- 5 -->
<text x="287" y="300" text-anchor="middle" class="text" font-weight="bold">5. NTLM Authenticate (HASH)</text>
<line x1="125" y1="310" x2="440" y2="310" class="line" marker-end="url(#arrowhead)"/>

<!-- Nota de Captura -->
<g>
    <rect class="note" x="360" y="340" width="190" height="60" rx="2" ry="2"/>
    <text x="450" y="365" text-anchor="middle" class="text" font-size="14">Hash Gardado</text>
    <text x="455" y="385" text-anchor="middle" class="text" font-size="12">(Listo para Hashcat/John)</text>
</g>

<!-- Peche -->
<text x="287" y="420" text-anchor="middle" class="text" fill="red">X Pecha conexión</text>

</svg>
