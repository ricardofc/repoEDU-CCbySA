<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="780" viewBox="0 0 1920 780" role="img" aria-labelledby="titulo descricion">
 <title id="titulo">Práctica 4 — Fluxo de tool calling dun axente Python e Ollama</title>
 <desc id="descricion">O usuario inicia o axente Python. Na volta 1 Ollama solicita dúas chamadas á ferramenta ler_evidencia; Python valida e le nmap.txt e http.txt e devolve os resultados. Na volta 2 Ollama solicita gardar_informe; Python verifica que leu ambos ficheiros e garda informe-axente.md. Na volta 3 Ollama responde ao usuario e Python indica a ruta de saída. Ollama serve o modelo; só Python executa ferramentas e accede ao disco.</desc>
 <defs><style>
 .h{font-family:DejaVu Sans,Arial,sans-serif;fill:#783016;font-weight:700}
 .b{font-family:DejaVu Sans,Arial,sans-serif;fill:#913c20}
 .small{font-family:DejaVu Sans,Arial,sans-serif;fill:#626b73}
 .code{font-family:DejaVu Sans Mono,monospace;fill:#7e3a22}
 </style>
 <marker id="orange-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#9e3618" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="blue-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#3173a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
 </defs>
