<circle cx="77" cy="263" r="22" fill="#dc5428"/><text x="77" y="271" fill="#ffffff" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="middle">1</text>
<text x="183.0" y="310" font-family="DejaVu Sans,Arial" font-size="23" font-weight="700" fill="#793219" text-anchor="middle">PETICIÓN</text>
<text x="183.0" y="345" class="b" font-size="20" text-anchor="middle">O usuario solicita</text>
<text x="183.0" y="375" class="b" font-size="20" font-weight="700" text-anchor="middle">analizar evidencias</text>
<text x="183.0" y="408" class="b" font-size="19" text-anchor="middle">e crear un informe</text>
<text x="183.0" y="439" class="small" font-size="16" font-weight="700" text-anchor="middle">ENTRADA</text>
<rect x="359" y="231" width="272" height="232" rx="21" fill="#fbedeb" stroke="#e65a2c" stroke-width="3"/>
<circle cx="389" cy="263" r="22" fill="#dc5428"/><text x="389" y="271" fill="#ffffff" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="middle">2</text>
<text x="495.0" y="310" font-family="DejaVu Sans,Arial" font-size="23" font-weight="700" fill="#793219" text-anchor="middle">VOLTA 1</text>
<text x="495.0" y="345" class="b" font-size="20" text-anchor="middle">Ollama solicita</text>
<text x="495.0" y="375" class="b" font-size="20" font-weight="700" text-anchor="middle">ler_evidencia()</text>
<text x="495.0" y="408" class="b" font-size="19" text-anchor="middle">dúas veces</text>
<text x="495.0" y="439" class="small" font-size="16" font-weight="700" text-anchor="middle">MODELO · TOOL CALLS</text>
<rect x="671" y="231" width="272" height="232" rx="21" fill="#fbedeb" stroke="#e65a2c" stroke-width="3"/>
<circle cx="701" cy="263" r="22" fill="#dc5428"/><text x="701" y="271" fill="#ffffff" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="middle">3</text>
<text x="807.0" y="310" font-family="DejaVu Sans,Arial" font-size="23" font-weight="700" fill="#793219" text-anchor="middle">LECTURA PYTHON</text>
<text x="807.0" y="345" class="b" font-size="20" text-anchor="middle">Valida a lista branca</text>
<text x="807.0" y="375" class="b" font-size="20" font-weight="700" text-anchor="middle">nmap.txt e http.txt</text>
<text x="807.0" y="408" class="b" font-size="19" text-anchor="middle">Devolve resultados</text>
<text x="807.0" y="439" class="small" font-size="16" font-weight="700" text-anchor="middle">FERRAMENTA</text>
<rect x="983" y="231" width="272" height="232" rx="21" fill="#fbedeb" stroke="#e65a2c" stroke-width="3"/>
<circle cx="1013" cy="263" r="22" fill="#dc5428"/><text x="1013" y="271" fill="#ffffff" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="middle">4</text>
<text x="1119.0" y="310" font-family="DejaVu Sans,Arial" font-size="23" font-weight="700" fill="#793219" text-anchor="middle">VOLTA 2</text>
<text x="1119.0" y="345" class="b" font-size="20" text-anchor="middle">Ollama solicita</text>
<text x="1119.0" y="375" class="b" font-size="20" font-weight="700" text-anchor="middle">gardar_informe()</text>
<text x="1119.0" y="408" class="b" font-size="19" text-anchor="middle">co informe xerado</text>
<text x="1119.0" y="439" class="small" font-size="16" font-weight="700" text-anchor="middle">MODELO · TOOL CALL</text>
