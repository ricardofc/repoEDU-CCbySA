</g>
<rect x="47" y="567" width="1826" height="123" rx="20" fill="#eaf4fc" stroke="#3173a4" stroke-width="3"/>
<text x="960" y="609" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="30" font-weight="700" fill="#174c75">OLLAMA · MODELO LOCAL SERVIDO POR API HTTP</text>
<text x="960" y="647" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="22" fill="#2e6087">Solicita ferramentas e xera respostas; non le nin escribe ficheiros directamente</text>
<text x="960" y="732" font-family="DejaVu Sans,Arial" font-size="20" fill="#626b73" text-anchor="middle">As voltas 1, 2 e 3 son as observadas no rexistro real. Non son tres axentes distintos.</text>
<text x="960" y="759" font-family="DejaVu Sans,Arial" font-size="18" fill="#626b73" text-anchor="middle">O código Python define a lista branca de ficheiros e executa as chamadas autorizadas.</text>
</svg>