<circle cx="1325" cy="263" r="22" fill="#dc5428"/><text x="1325" y="271" fill="#ffffff" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="middle">5</text>
<text x="1431.0" y="310" font-family="DejaVu Sans,Arial" font-size="23" font-weight="700" fill="#793219" text-anchor="middle">GARDADO PYTHON</text>
<text x="1431.0" y="345" class="b" font-size="20" text-anchor="middle">Comproba as lecturas</text>
<text x="1431.0" y="375" class="b" font-size="20" font-weight="700" text-anchor="middle">informe-axente.md</text>
<text x="1431.0" y="408" class="b" font-size="19" text-anchor="middle">Escribe no disco</text>
<text x="1431.0" y="439" class="small" font-size="16" font-weight="700" text-anchor="middle">FERRAMENTA</text>
<rect x="1607" y="231" width="272" height="232" rx="21" fill="#fbedeb" stroke="#e65a2c" stroke-width="3"/>
<circle cx="1637" cy="263" r="22" fill="#dc5428"/><text x="1637" y="271" fill="#ffffff" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" text-anchor="middle">6</text>
<text x="1743.0" y="310" font-family="DejaVu Sans,Arial" font-size="23" font-weight="700" fill="#793219" text-anchor="middle">VOLTA 3</text>
<text x="1743.0" y="345" class="b" font-size="20" text-anchor="middle">Ollama confirma</text>
<text x="1743.0" y="375" class="b" font-size="20" font-weight="700" text-anchor="middle">o resultado ao usuario</text>
<text x="1743.0" y="408" class="b" font-size="19" text-anchor="middle">Python verifica o ficheiro</text>
<text x="1743.0" y="439" class="small" font-size="16" font-weight="700" text-anchor="middle">MODELO · SAÍDA</text>
<g stroke="#3173a4" stroke-width="3.3" stroke-dasharray="7 10" fill="none" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)">
<line x1="495.0" y1="479" x2="495.0" y2="551"/>
