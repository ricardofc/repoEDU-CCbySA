<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img">
<title>Xerarquía entre modelo, axente, subaxente e equipo de axentes</title>
<desc>Un equipo de axentes contén un orquestrador e varios membros; cada un é un axente que leva dentro un modelo (o motor) máis ferramentas e un bucle. O orquestrador coordina os membros. Calquera axente pode delegar unha subtarefa nun subaxente externo, que traballa illado e devolve o resultado.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.title{font-size:14px;font-weight:500;fill:#26215C;}
.type{font-size:12px;fill:#3C3489;}
.bucle{font-size:12px;fill:#3C3489;}
.mtxt{font-size:12px;font-weight:500;fill:#04342C;}
.ttxt{font-size:12px;fill:#2C2C2A;}
.teamlbl{font-size:14px;font-weight:500;fill:#2C2C2A;}
.edge{font-size:12px;fill:#5F5E5A;}
.cap{font-size:12px;fill:#5F5E5A;}
.leg{font-size:12px;fill:#2C2C2A;}
.agent{fill:#EEEDFE;stroke:#534AB7;stroke-width:1;}
.model{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1;}
.tools{fill:#D3D1C7;stroke:#5F5E5A;stroke-width:1;}
.team{fill:none;stroke:#5F5E5A;stroke-width:1.2;stroke-dasharray:6 5;}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none;}
.legteal{fill:#E1F5EE;stroke:#0F6E56;}
.legpurple{fill:#EEEDFE;stroke:#534AB7;}
.legteam{fill:none;stroke:#5F5E5A;stroke-width:1.2;stroke-dasharray:3 3;}
@media (prefers-color-scheme:dark){
.title{fill:#CECBF6;}.type{fill:#AFA9EC;}.bucle{fill:#AFA9EC;}
.mtxt{fill:#9FE1CB;}.ttxt{fill:#D3D1C7;}
.teamlbl{fill:#D3D1C7;}.edge{fill:#B4B2A9;}.cap{fill:#B4B2A9;}.leg{fill:#D3D1C7;}
.agent{fill:#3C3489;stroke:#AFA9EC;}.model{fill:#085041;stroke:#5DCAA5;}.tools{fill:#444441;stroke:#B4B2A9;}
.team{stroke:#888780;}.arr{stroke:#B4B2A9;}
.legteal{fill:#085041;stroke:#5DCAA5;}.legpurple{fill:#3C3489;stroke:#AFA9EC;}.legteam{stroke:#888780;}
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect class="team" x="36" y="44" width="604" height="278" rx="16"/>
<text class="teamlbl" x="52" y="70">Equipo de axentes</text>

<line class="arr" x1="340" y1="182" x2="168" y2="208" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="182" x2="512" y2="208" marker-end="url(#arrow)"/>
<text class="edge" x="340" y="200" text-anchor="middle" dominant-baseline="central">coordina</text>

<line class="arr" x1="146" y1="306" x2="146" y2="358" marker-end="url(#arrow)"/>
<line class="arr" x1="182" y1="358" x2="182" y2="306" marker-end="url(#arrow)"/>
<text class="edge" x="138" y="338" text-anchor="end" dominant-baseline="central">delega</text>
<text class="edge" x="190" y="338" text-anchor="start" dominant-baseline="central">resultado</text>
<text class="cap" x="296" y="330">Calquera axente pode</text>
<text class="cap" x="296" y="348">crear un subaxente (fóra do equipo)</text>

<rect class="agent" x="240" y="86" width="200" height="96" rx="12"/>
<text class="title" x="256" y="114">Orquestrador</text>
<text class="bucle" x="424" y="114" text-anchor="end">↻ bucle</text>
<rect class="model" x="254" y="132" width="80" height="32" rx="8"/>
<text class="mtxt" x="294" y="148" text-anchor="middle" dominant-baseline="central">modelo</text>
<rect class="tools" x="340" y="132" width="86" height="32" rx="8"/>
<text class="ttxt" x="383" y="148" text-anchor="middle" dominant-baseline="central">ferramentas</text>
<text class="type" x="340" y="176" text-anchor="middle">axente</text>

<rect class="agent" x="64" y="210" width="200" height="96" rx="12"/>
<text class="title" x="80" y="238">Membro</text>
<text class="bucle" x="248" y="238" text-anchor="end">↻ bucle</text>
<rect class="model" x="78" y="256" width="80" height="32" rx="8"/>
<text class="mtxt" x="118" y="272" text-anchor="middle" dominant-baseline="central">modelo</text>
<rect class="tools" x="164" y="256" width="86" height="32" rx="8"/>
<text class="ttxt" x="207" y="272" text-anchor="middle" dominant-baseline="central">ferramentas</text>
<text class="type" x="164" y="300" text-anchor="middle">axente</text>

<rect class="agent" x="416" y="210" width="200" height="96" rx="12"/>
<text class="title" x="432" y="238">Membro</text>
<text class="bucle" x="600" y="238" text-anchor="end">↻ bucle</text>
<rect class="model" x="430" y="256" width="80" height="32" rx="8"/>
<text class="mtxt" x="470" y="272" text-anchor="middle" dominant-baseline="central">modelo</text>
<rect class="tools" x="516" y="256" width="86" height="32" rx="8"/>
<text class="ttxt" x="559" y="272" text-anchor="middle" dominant-baseline="central">ferramentas</text>
<text class="type" x="516" y="300" text-anchor="middle">axente</text>

<rect class="agent" x="64" y="360" width="200" height="96" rx="12"/>
<text class="title" x="80" y="388">Subaxente</text>
<text class="bucle" x="248" y="388" text-anchor="end">↻ bucle</text>
<rect class="model" x="78" y="406" width="80" height="32" rx="8"/>
<text class="mtxt" x="118" y="422" text-anchor="middle" dominant-baseline="central">modelo</text>
<rect class="tools" x="164" y="406" width="86" height="32" rx="8"/>
<text class="ttxt" x="207" y="422" text-anchor="middle" dominant-baseline="central">ferramentas</text>
<text class="type" x="164" y="450" text-anchor="middle">axente</text>

<text class="cap" x="340" y="486" text-anchor="middle">Cada axente = modelo (motor) + ferramentas + bucle</text>
<rect class="legteal" x="176" y="498" width="14" height="14" rx="3"/>
<text class="leg" x="196" y="510">modelo</text>
<rect class="legpurple" x="280" y="498" width="14" height="14" rx="3"/>
<text class="leg" x="300" y="510">axente</text>
<rect class="legteam" x="384" y="498" width="14" height="14" rx="3"/>
<text class="leg" x="404" y="510">equipo</text>
</svg>