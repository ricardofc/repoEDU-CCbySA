<!-- ========================================== -->
<!-- DIAGRAMA 1: ESCENARIO DE PIVOTING -->
<!-- escenario-pivoting-vboxnet0-vboxnet1-linux-windows.svg -->
<!-- ========================================== -->

<svg width="1150pt" height="550pt" viewBox="0.00 0.00 1150.00 550.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
    <!-- DEFINICIÓN DE PUNTAS DE FRECHA -->
    
    <!-- AZUL (NAT) -->
    <marker id="arrowBlueStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M10,0 L10,6 L0,3 z" fill="#0277bd" />
    </marker>
    <marker id="arrowBlueEnd" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L10,3 z" fill="#0277bd" />
    </marker>

    <!-- VERMELLO (Host-Only) -->
    <marker id="arrowRedStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M10,0 L10,6 L0,3 z" fill="#c62828" />
    </marker>
    <marker id="arrowRedEnd" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L10,3 z" fill="#c62828" />
    </marker>

    <!-- VERDE (Interna) -->
    <marker id="arrowGreenStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M10,0 L10,6 L0,3 z" fill="#00695c" />
    </marker>
    <marker id="arrowGreenEnd" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L10,3 z" fill="#00695c" />
    </marker>

    <!-- LARANXA (Internet) -->
    <marker id="arrowOrangeStart" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M10,0 L10,6 L0,3 z" fill="#ef6c00" />
    </marker>
    <marker id="arrowOrangeEnd" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L10,3 z" fill="#ef6c00" />
    </marker>
</defs>

<!-- FONDO BRANCO -->
<rect x="0" y="0" width="1150" height="550" fill="white" />

<!-- 1. ZONAS DE REDE (FONDOS) -->
<!-- Internet Box -->
<rect x="25" y="15" width="95" height="60" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="72" y="50" font-family="Arial" font-size="14" text-anchor="middle" fill="black">Internet</text>

<!-- Marco Anfitrión -->
<rect x="15" y="110" width="1100" height="420" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8,4"/>
<text x="560" y="135" font-family="Arial" font-size="14" text-anchor="middle" fill="#666666">Máquina Anfitrión / Host Físico (VirtualBox)</text>

<!-- Zona NAT (Azul) -->
<rect x="50" y="160" width="205" height="175" fill="#e1f5fe" stroke="none"/>
<text x="152" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#0277bd">Rede 1: NAT</text>
<text x="152" y="200" font-family="Arial" font-size="11" text-anchor="middle" fill="#0277bd">(10.0.2.x)</text>

<!-- Zona Host-Only (Vermello) -->
<rect x="285" y="160" width="260" height="175" fill="#ffebee" stroke="none"/>
<text x="415" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#c62828">Rede 2: Host-Only</text>
<text x="415" y="200" font-family="Arial" font-size="11" text-anchor="middle" fill="#c62828">(192.168.56.0/24)</text>

<!-- Zona Interna (Verde) -->
<rect x="590" y="160" width="490" height="175" fill="#e0f2f1" stroke="none"/>
<text x="835" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#00695c">Rede 3: Host-Only (vboxnet1)</text>
<text x="835" y="200" font-family="Arial" font-size="11" text-anchor="middle" fill="#00695c">(vboxnet1 · 192.168.57.0/24)</text>


<!-- 2. DISPOSITIVOS DE REDE (SWITCHES/ROUTERS) -->

<!-- Gateway NAT -->
<rect x="87" y="230" width="130" height="60" fill="#b3e5fc" stroke="#0277bd" stroke-width="2"/>
<text x="152" y="255" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">Gateway Virtual</text>
<text x="152" y="270" font-family="Arial" font-size="10" text-anchor="middle">NAT</text>

<!-- Switch HO -->
<rect x="350" y="230" width="130" height="60" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
<text x="415" y="255" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">Switch Virtual</text>
<text x="415" y="270" font-family="Arial" font-size="10" text-anchor="middle">vboxnet0</text>

<!-- Rede Interna -->
<rect x="770" y="230" width="130" height="60" fill="#b2dfdb" stroke="#00695c" stroke-width="2" stroke-dasharray="4,2"/>
<text x="835" y="255" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle">Rede Host-Only</text>
<text x="835" y="270" font-family="Arial" font-size="10" text-anchor="middle">vboxnet1</text>


<!-- 3. MÁQUINAS VIRTUAIS -->

<!-- KALI LINUX -->
<rect x="50" y="365" width="340" height="130" fill="#222222" stroke="none"/>
<text x="220" y="395" font-family="Arial" font-size="14" text-anchor="middle" fill="white">VM: Kali Linux (Atacante)</text>

<!-- Kali NICs -->
<rect x="80" y="425" width="100" height="50" fill="none" stroke="#00f2ea" stroke-width="1.5"/>
<path d="M165,425 L180,425 L180,440 L165,425" fill="#00f2ea" stroke="none" />
<text x="130" y="440" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle" fill="white">eth0</text>
<text x="130" y="455" font-family="Arial" font-size="9" text-anchor="middle" fill="white">NAT (DHCP)</text>

<rect x="265" y="425" width="100" height="50" fill="none" stroke="#00f2ea" stroke-width="1.5"/>
<path d="M350,425 L365,425 L365,440 L350,425" fill="#00f2ea" stroke="none" />
<text x="315" y="440" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle" fill="white">eth1</text>
<text x="315" y="455" font-family="Arial" font-size="9" text-anchor="middle" fill="white">Host-Only</text>
<text x="315" y="468" font-family="Arial" font-style="italic" font-size="9" text-anchor="middle" fill="white">.56.X</text>


<!-- VULNYX BASIC (Linux - Pivote) -->
<rect x="415" y="365" width="245" height="130" fill="#00695c" stroke="none"/>
<text x="537" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="white">VM: VulNyx Basic</text>
<text x="537" y="410" font-family="Arial" font-size="11" text-anchor="middle" fill="white">(Pivote / Ponte)</text>

<!-- Basic NICs -->
<rect x="435" y="425" width="90" height="50" fill="none" stroke="white" stroke-width="1.5"/>
<path d="M510,425 L525,425 L525,440 L510,425" fill="white" stroke="none" />
<text x="480" y="440" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle" fill="white">eth0</text>
<text x="480" y="455" font-family="Arial" font-size="9" text-anchor="middle" fill="white">Host-Only</text>
<text x="480" y="468" font-family="Arial" font-style="italic" font-size="9" text-anchor="middle" fill="white">.56.X</text>

<rect x="555" y="425" width="90" height="50" fill="none" stroke="white" stroke-width="1.5"/>
<path d="M630,425 L645,425 L645,440 L630,425" fill="white" stroke="none" />
<text x="600" y="440" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle" fill="white">eth1</text>
<text x="600" y="455" font-family="Arial" font-size="9" text-anchor="middle" fill="white">Host-Only</text>
<text x="600" y="468" font-family="Arial" font-style="italic" font-size="9" text-anchor="middle" fill="white">192.168.57.X</text>


<!-- VULNYX WAR (Windows - Vítima) -->
<rect x="880" y="365" width="200" height="130" fill="#0078d7" stroke="none"/>
<text x="980" y="390" font-family="Arial" font-size="14" text-anchor="middle" fill="white">VM: VulNyx War</text>
<text x="980" y="410" font-family="Arial" font-size="11" text-anchor="middle" fill="white">(Vítima Final)</text>

<!-- War NIC -->
<rect x="940" y="425" width="120" height="50" fill="none" stroke="white" stroke-width="1.5"/>
<path d="M1045,425 L1060,425 L1060,440 L1045,425" fill="white" stroke="none" />
<text x="1000" y="440" font-family="Arial" font-weight="bold" font-size="10" text-anchor="middle" fill="white">NIC 1</text>
<text x="1000" y="455" font-family="Arial" font-size="9" text-anchor="middle" fill="white">Host-Only</text>
<text x="1000" y="468" font-family="Arial" font-style="italic" font-size="9" text-anchor="middle" fill="white">192.168.57.Y</text>


<!-- 4. CONEXIÓNS (CABLES) -->

<!-- Internet -> Gateway (Laranxa) -->
<path d="M45,75 L45,260 L87,260" fill="none" stroke="#ef6c00" stroke-width="3" 
      marker-start="url(#arrowOrangeStart)" marker-end="url(#arrowOrangeEnd)"/>

<!-- Kali eth0 -> Gateway (Azul) -->
<path d="M130,425 L130,290" fill="none" stroke="#0277bd" stroke-width="2" 
      marker-start="url(#arrowBlueStart)" marker-end="url(#arrowBlueEnd)"/>

<!-- Kali eth1 -> Switch HO (Vermello) -->
<path d="M315,425 L315,260 L350,260" fill="none" stroke="#c62828" stroke-width="2" 
      marker-start="url(#arrowRedStart)" marker-end="url(#arrowRedEnd)"/>

<!-- Basic eth0 -> Switch HO (Vermello) -->
<path d="M480,425 L480,350 L500,350 L500,260 L480,260" fill="none" stroke="#c62828" stroke-width="2" 
      marker-start="url(#arrowRedStart)" marker-end="url(#arrowRedEnd)"/>

<!-- Basic eth1 -> Rede Interna (Verde) -->
<path d="M600,425 L600,350 L650,350 L650,260 L770,260" fill="none" stroke="#00695c" stroke-width="2" 
      marker-start="url(#arrowGreenStart)" marker-end="url(#arrowGreenEnd)"/>

<!-- War NIC 1 -> Rede Interna (Verde) -->
<path d="M1040,425 L1040,260 L900,260" fill="none" stroke="#00695c" stroke-width="2" 
      marker-start="url(#arrowGreenStart)" marker-end="url(#arrowGreenEnd)"/>

<!-- Pivoting Line (Dashed) -->
<line x1="645" y1="450" x2="940" y2="450" stroke="#222222" stroke-width="2" stroke-dasharray="5,3"/>
<text x="792" y="440" font-family="Arial" font-weight="bold" font-size="11" text-anchor="middle" fill="#222222">Pivoting</text>
<text x="792" y="465" font-family="Arial" font-size="10" text-anchor="middle" fill="#222222">(Chisel / Socat / SSH)</text>

</svg>
