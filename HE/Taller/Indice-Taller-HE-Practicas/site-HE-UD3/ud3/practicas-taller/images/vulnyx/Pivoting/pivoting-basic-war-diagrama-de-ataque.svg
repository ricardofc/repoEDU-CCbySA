<text x="110" y="95" font-family="Arial" font-size="12" text-anchor="middle">Basic (root)</text>

<!-- Arrow -->
<line x1="110" y1="110" x2="110" y2="140" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

