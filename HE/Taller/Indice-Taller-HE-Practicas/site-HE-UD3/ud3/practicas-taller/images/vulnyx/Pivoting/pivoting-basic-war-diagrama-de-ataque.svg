<!-- ========================================== -->

<svg width="1000pt" height="900pt" viewBox="0.00 0.00 1000.00 900.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
    <!-- Marcador de Frecha -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
</defs>

<!-- Fondo -->
<rect x="0" y="0" width="1000" height="900" fill="white" />

<!-- ========================================== -->
<!-- FASE 1: RECOPILACIÓN -->
