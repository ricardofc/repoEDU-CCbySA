<svg width="1000" height="980" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="1000" height="980" fill="#ffffff"/>
  
  <!-- ============================================ -->
  <!-- PARTE SUPERIOR: KERBEROS NORMAL -->
  <!-- ============================================ -->
  
  <!-- Fondo azul claro -->
  <rect x="10" y="10" width="980" height="410" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="8"/>
  
  <!-- Título -->
  <circle cx="30" cy="30" r="8" fill="#1565c0"/>
  <text x="45" y="36" font-family="Arial" font-size="16" font-weight="bold" fill="#0d47a1">
    AUTENTICACION KERBEROS NORMAL (Lexitima)
  </text>
  
  <!-- Cabeceras de actores -->
  <rect x="60" y="55" width="140" height="50" fill="#bbdefb" stroke="#1565c0" stroke-width="2" rx="5"/>
  <text x="130" y="75" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Usuario</text>
  <text x="130" y="93" font-family="Arial" font-size="11" text-anchor="middle">(Administrador)</text>
  
  <rect x="340" y="55" width="180" height="50" fill="#90caf9" stroke="#0d47a1" stroke-width="2" rx="5"/>
  <text x="430" y="75" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Domain Controller</text>
  <text x="430" y="93" font-family="Arial" font-size="11" text-anchor="middle">(KDC - krbtgt)</text>
  
  <rect x="700" y="55" width="140" height="50" fill="#64b5f6" stroke="#1565c0" stroke-width="2" rx="5"/>
  <text x="770" y="75" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Calquera Servizo</text>
  <text x="770" y="93" font-family="Arial" font-size="11" text-anchor="middle">(Todo o dominio)</text>
  
  <!-- Liñas verticais (lifelines) -->
  <line x1="130" y1="105" x2="130" y2="400" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="430" y1="105" x2="430" y2="400" stroke="#0d47a1" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="770" y1="105" x2="770" y2="400" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- FASE 1: AS-REQ -->
  <rect x="20" y="130" width="70" height="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="3"/>
  <text x="55" y="147" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">FASE 1</text>
  
  <line x1="130" y1="142" x2="430" y2="142" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowblue)"/>
  <circle cx="135" cy="142" r="10" fill="#1565c0"/>
  <text x="135" y="147" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">1</text>
  <text x="280" y="135" font-family="Arial" font-size="11" text-anchor="middle">AS-REQ</text>
  <text x="280" y="158" font-family="Arial" font-size="10" text-anchor="middle">(usuario + contrasinal)</text>
  
  <!-- FASE 2: AS-REP -->
  <rect x="20" y="180" width="70" height="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="3"/>
  <text x="55" y="197" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">FASE 2</text>
  
  <line x1="430" y1="192" x2="130" y2="192" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrowblue)"/>
  <circle cx="425" cy="192" r="10" fill="#1565c0"/>
  <text x="425" y="197" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">2</text>
  <text x="280" y="185" font-family="Arial" font-size="11" text-anchor="middle">AS-REP (TGT)</text>
  <text x="280" y="208" font-family="Arial" font-size="10" text-anchor="middle">(asignado por krbtgt, valido 10h)</text>
  
  <!-- FASE 3: TGS-REQ -->
  <rect x="20" y="230" width="70" height="25" fill="#e3f2fd" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="55" y="247" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">FASE 3</text>
  
  <line x1="130" y1="242" x2="430" y2="242" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <circle cx="135" cy="242" r="10" fill="#2e7d32"/>
  <text x="135" y="247" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">3</text>
  <text x="280" y="235" font-family="Arial" font-size="11" text-anchor="middle">TGS-REQ</text>
  <text x="280" y="258" font-family="Arial" font-size="10" text-anchor="middle">(TGT + SPN solicitado)</text>
  
  <!-- FASE 4: TGS-REP -->
  <rect x="20" y="280" width="70" height="25" fill="#e3f2fd" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="55" y="297" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">FASE 4</text>
  
  <line x1="430" y1="292" x2="130" y2="292" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrowgreen)"/>
  <circle cx="425" cy="292" r="10" fill="#2e7d32"/>
  <text x="425" y="297" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">4</text>
  <text x="280" y="285" font-family="Arial" font-size="11" text-anchor="middle">TGS-REP</text>
  <text x="280" y="308" font-family="Arial" font-size="10" text-anchor="middle">(TGS para o servizo)</text>
  
  <!-- FASE 5: AP-REQ -->
  <rect x="20" y="330" width="70" height="25" fill="#e3f2fd" stroke="#ef6c00" stroke-width="1" rx="3"/>
  <text x="55" y="347" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">FASE 5</text>
  
  <line x1="130" y1="342" x2="770" y2="342" stroke="#ef6c00" stroke-width="2" marker-end="url(#arroworange)"/>
  <circle cx="135" cy="342" r="10" fill="#ef6c00"/>
  <text x="135" y="347" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">5</text>
  <text x="450" y="335" font-family="Arial" font-size="11" text-anchor="middle">AP-REQ (Presenta TGS)</text>
  
  <!-- FASE 6: AP-REP -->
  <rect x="20" y="370" width="70" height="25" fill="#e3f2fd" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="55" y="387" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">FASE 6</text>
  
  <line x1="770" y1="382" x2="130" y2="382" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrowgreen)"/>
  <circle cx="765" cy="382" r="10" fill="#2e7d32"/>
  <text x="765" y="387" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">6</text>
  <text x="450" y="375" font-family="Arial" font-size="11" text-anchor="middle">AP-REP (Acceso permitido)</text>
  
  
  <!-- ============================================ -->
  <!-- SEPARADOR -->
  <!-- ============================================ -->
  <line x1="10" y1="435" x2="990" y2="435" stroke="#d32f2f" stroke-width="4"/>
  
  
  <!-- ============================================ -->
  <!-- PARTE INFERIOR: GOLDEN TICKET -->
  <!-- ============================================ -->
  
  <!-- Fondo vermello claro -->
  <rect x="10" y="460" width="980" height="500" fill="#ffebee" stroke="#c62828" stroke-width="3" rx="8"/>
  
  <!-- Título -->
  <circle cx="30" cy="480" r="8" fill="#c62828"/>
  <text x="45" y="486" font-family="Arial" font-size="16" font-weight="bold" fill="#b71c1c">
    ATAQUE GOLDEN TICKET (Falsificacion Total do Dominio)
  </text>
  
  <!-- Cabeceras de actores -->
  <rect x="60" y="505" width="140" height="50" fill="#ffcdd2" stroke="#c62828" stroke-width="2" rx="5"/>
  <text x="130" y="525" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Atacante</text>
  <text x="130" y="543" font-family="Arial" font-size="11" text-anchor="middle">(suplanta Admin)</text>
  
  <rect x="340" y="505" width="180" height="50" fill="#90caf9" stroke="#0d47a1" stroke-width="2" rx="5"/>
  <text x="430" y="525" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Domain Controller</text>
  <text x="430" y="543" font-family="Arial" font-size="11" text-anchor="middle">(KDC - krbtgt)</text>
  
  <rect x="700" y="505" width="140" height="50" fill="#ef9a9a" stroke="#c62828" stroke-width="2" rx="5"/>
  <text x="770" y="525" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">CALQUERA</text>
  <text x="770" y="543" font-family="Arial" font-size="11" text-anchor="middle">Servizo do Dominio</text>
  
  <!-- Liñas verticais (lifelines) -->
  <line x1="130" y1="555" x2="130" y2="940" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="430" y1="555" x2="430" y2="940" stroke="#0d47a1" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="770" y1="555" x2="770" y2="940" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- ============================================ -->
  <!-- FASES 1-2: OMITIDAS (FORXADO OFFLINE) -->
  <!-- ============================================ -->
  
 
  <!-- Bloque grande de FASES 1-2 OMITIDAS -->
  <rect x="230" y="575" width="280" height="90" fill="#ffcccc" stroke="#b71c1c" stroke-width="3" rx="5"/>
  <text x="370" y="600" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#b71c1c">FASES 1-2 OMITIDAS</text>
  <text x="370" y="625" font-family="Arial" font-size="11" text-anchor="middle">O atacante NON solicita TGT ao KDC</text>
  <text x="370" y="645" font-family="Arial" font-size="11" text-anchor="middle">Forxa un TGT OFFLINE con hash krbtgt</text>
  
  <!-- Caixa de forxado offline -->
  <rect x="60" y="590" width="140" height="65" fill="#fff9c4" stroke="#f57f17" stroke-width="2" rx="5"/>
  <text x="130" y="610" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">FORXADO</text>
  <text x="130" y="625" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">OFFLINE</text>
  <text x="130" y="645" font-family="Arial" font-size="9" text-anchor="middle">impacket-ticketer</text>
  
  <!-- Frecha vertical cara abaixo -->
  <line x1="130" y1="655" x2="130" y2="680" stroke="#f57f17" stroke-width="2" marker-end="url(#arrowyellow)"/>

  <!-- TGT FALSIFICADO -->
  <rect x="60" y="680" width="140" height="85" fill="#ffd54f" stroke="#ff6f00" stroke-width="3" rx="5"/>
  <text x="130" y="700" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">TGT</text>
  <text x="130" y="715" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">FALSIFICADO</text>
  <text x="130" y="735" font-family="Arial" font-size="9" text-anchor="middle">Admin.ccache</text>
  <text x="130" y="750" font-family="Arial" font-size="8" text-anchor="middle">Valido: 10 anos</text>
  
  <!-- ============================================ -->
  <!-- FASE 3: TGS-REQ (AGORA SI CONTACTA KDC) -->
  <!-- ============================================ -->
  
  <rect x="20" y="790" width="70" height="25" fill="#ffebee" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="55" y="807" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">FASE 3</text>
  
  <line x1="130" y1="802" x2="430" y2="802" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <circle cx="135" cy="802" r="10" fill="#2e7d32"/>
  <text x="135" y="807" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">3</text>
  <text x="280" y="795" font-family="Arial" font-size="11" text-anchor="middle">TGS-REQ</text>
  <text x="280" y="818" font-family="Arial" font-size="10" text-anchor="middle">(TGT falso + SPN)</text>
  
  <!-- FASE 4: TGS-REP -->
  <rect x="20" y="830" width="70" height="25" fill="#ffebee" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="55" y="847" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">FASE 4</text>
  
  <line x1="430" y1="842" x2="130" y2="842" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrowgreen)"/>
  <circle cx="425" cy="842" r="10" fill="#2e7d32"/>
  <text x="425" y="847" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">4</text>
  <text x="280" y="835" font-family="Arial" font-size="11" text-anchor="middle">TGS-REP</text>
  <text x="280" y="858" font-family="Arial" font-size="10" text-anchor="middle">(KDC cre que e lexitimo)</text>
  
  <!-- Nota explicativa ao lado do KDC -->
  <rect x="540" y="775" width="150" height="90" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="615" y="795" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#1b5e20">KDC SI SE USA</text>
  <text x="615" y="813" font-family="Arial" font-size="9" text-anchor="middle">Pero non detecta que</text>
  <text x="615" y="828" font-family="Arial" font-size="9" text-anchor="middle">o TGT e falso porque</text>
  <text x="615" y="843" font-family="Arial" font-size="9" text-anchor="middle">esta firmado co hash</text>
  <text x="615" y="858" font-family="Arial" font-size="9" text-anchor="middle">de krbtgt</text>
  
  <!-- ============================================ -->
  <!-- COLUMNA DEREITA (SERVIZOS) -->
  <!-- ============================================ -->

  <!-- Caixa de multiples servizos -->
  <rect x="700" y="590" width="140" height="165" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="770" y="615" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle" fill="#1b5e20">TODOS OS SERVIZOS:</text>
  
  <!-- Lista de servizos -->
  <text x="720" y="640" font-family="Arial" font-size="9" fill="#2e7d32">SQL Server</text>
  <text x="720" y="658" font-family="Arial" font-size="9" fill="#2e7d32">SMB/CIFS</text>
  <text x="720" y="676" font-family="Arial" font-size="9" fill="#2e7d32">HTTP/HTTPS</text>
  <text x="720" y="694" font-family="Arial" font-size="9" fill="#2e7d32">LDAP</text>
  <text x="720" y="712" font-family="Arial" font-size="9" fill="#2e7d32">WinRM</text>
  <text x="720" y="730" font-family="Arial" font-size="9" fill="#2e7d32">RDP</text>
  <text x="720" y="748" font-family="Arial" font-size="9" fill="#2e7d32">...</text>

  <!-- ============================================ -->
  <!-- FASE 5: AP-REQ -->
  <!-- ============================================ -->
  
  <rect x="20" y="870" width="70" height="25" fill="#ffebee" stroke="#ef6c00" stroke-width="1" rx="3"/>
  <text x="55" y="887" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">FASE 5</text>
  
  <line x1="130" y1="882" x2="770" y2="882" stroke="#ef6c00" stroke-width="2" marker-end="url(#arroworange)"/>
  <circle cx="135" cy="882" r="10" fill="#ef6c00"/>
  <text x="135" y="887" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">5</text>
  <text x="450" y="875" font-family="Arial" font-size="11" text-anchor="middle">AP-REQ (Presenta TGS)</text>

  <!-- ============================================ -->
  <!-- FASE 6: AP-REP -->
  <!-- ============================================ -->
 
  <rect x="20" y="910" width="70" height="25" fill="#e3f2fd" stroke="#2e7d32" stroke-width="1" rx="3"/>
  <text x="55" y="927" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">FASE 6</text>
  
  <line x1="770" y1="922" x2="130" y2="922" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,2" marker-end="url(#arrowgreen)"/>
  <circle cx="765" cy="922" r="10" fill="#2e7d32"/>
  <text x="765" y="927" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">6</text>
  <text x="450" y="915" font-family="Arial" font-size="11" text-anchor="middle" fill="#2e7d32">✓ ACCESO TOTAL PERMITIDO</text>
  <text x="450" y="940" font-family="Arial" font-size="11" text-anchor="middle" fill="#2e7d32">(Acceso a SQL, SMB/CIFS, WinRM...)</text>
 
  
  <!-- ============================================ -->
  <!-- DEFINICIONS (frechas) -->
  <!-- ============================================ -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef6c00"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d32f2f"/>
    </marker>
    <marker id="arrowyellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f57f17"/>
    </marker>
  </defs>
</svg>
